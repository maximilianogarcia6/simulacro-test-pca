<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Piloto Comercial - Avión (SRVSOP)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card2: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a, #111827 60%);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 16px 60px;
    }

    header {
      padding: 18px 4px 10px;
      text-align: center;
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0 0 4px;
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat .num {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .stat .lbl {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    select,
    button {
      font-family: inherit;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    select {
      width: 100%;
      padding: 12px;
      background: var(--card2);
      color: var(--text);
      margin-bottom: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #04121f;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      text-align: center;
    }

    .btn.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 600;
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 500;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .btn {
      flex: 1;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.12), rgba(17, 24, 39, 0.2));
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .2s ease;
    }

    .session-header:hover {
      border-color: rgba(56, 189, 248, 0.8);
      transform: translateY(-1px);
    }

    .session-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 700;
    }

    .btn.tiny {
      width: auto;
      min-width: 42px;
      padding: 8px 10px;
      font-size: 0.9rem;
      margin-top: 0;
    }

    .session-toggle-btn {
      width: auto;
      min-width: 38px;
      padding: 7px 10px;
      margin: 0;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 700;
      cursor: pointer;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .session-collapsed {
      display: none;
      opacity: 0;
      transform: translateY(-6px);
    }

    .session-body {
      transition: all .24s ease;
      overflow: hidden;
    }

    .search-inline-row {
      display: none;
      margin-top: 12px;
    }

    .search-inline-row.visible {
      display: block;
    }

    .section-list label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      cursor: pointer;
    }

    .section-list label:last-child {
      border-bottom: none;
    }

    .section-list input {
      width: 18px;
      height: 18px;
    }

    .count {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .progress-bar {
      height: 6px;
      background: var(--card2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width .25s;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--card2);
      color: var(--accent);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .qtext {
      font-size: 1.08rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      margin-bottom: 10px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
    }

    .opt b {
      color: var(--accent);
      margin-right: 8px;
    }

    .opt.correct {
      border-color: var(--good);
      background: rgba(34, 197, 94, 0.12);
    }

    .opt.incorrect {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
    }

    .opt.disabled {
      pointer-events: none;
      opacity: 0.85;
    }

    .opt.correct b,
    .opt.incorrect b {
      color: inherit;
    }

    .feedback {
      margin-top: 6px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .feedback.good {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--good);
    }

    .feedback.bad {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--bad);
    }

    .feedback .lead {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .feedback.good .lead {
      color: var(--good);
    }

    .feedback.bad .lead {
      color: var(--bad);
    }

    .feedback .expl {
      color: var(--muted);
    }

    .footer-nav {
      margin-top: 16px;
    }

    .center {
      text-align: center;
    }

    .big-num {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 6px 0;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 0.82rem;
    }

    .miss-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .miss-item:last-child {
      border-bottom: none;
    }

    .miss-item .q {
      color: var(--text);
      margin-bottom: 4px;
    }

    .miss-item .a {
      color: var(--good);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .modal-text {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    a.link {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>✈️ Quiz Piloto Comercial – Avión</h1>
      <p>Banco de preguntas SRVSOP · práctica diaria</p>
    </header>

    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <div class="stat-grid">
        <div class="stat">
          <div class="num" id="stat-total">-</div>
          <div class="lbl">Preguntas</div>
        </div>
        <div class="stat">
          <div class="num" id="stat-answered">-</div>
          <div class="lbl">Respondidas</div>
        </div>
        <div class="stat">
          <div class="num" id="stat-accuracy">-</div>
          <div class="lbl">Acierto global</div>
        </div>
      </div>

      <div class="card">
        <div class="session-header" id="session-header">
          <span class="session-title">Configurar sesión</span>
          <button class="session-toggle-btn" id="session-toggle-btn" type="button" aria-expanded="true"
            title="Abrir o cerrar configuración">▾</button>
        </div>

        <div id="session-settings-body" class="session-body">
          <label class="small muted" style="display:block; margin-bottom:6px;">Usuario</label>
          <input id="user-input" type="text" value="usuario1" placeholder="Nombre del usuario"
            style="width:100%; padding:12px; background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:10px; margin-bottom:10px;">

          <label class="small muted" style="display:block; margin-bottom:6px;">Materia</label>
          <select id="section-select"></select>

          <label class="small muted" style="display:block; margin:10px 0 6px;">Modo</label>
          <select id="mode-select">
            <option value="all">Todas las preguntas de la materia</option>
            <option value="unseen">Solo las que no practiqué</option>
            <option value="wrong">Repasar mis errores</option>
          </select>

          <label class="small muted" style="display:block; margin:10px 0 6px;">Cantidad de preguntas</label>
          <select id="length-select"></select>
        </div>

        <div class="row" style="margin-top:12px;">
          <button class="btn secondary" id="search-id-btn"
            style="margin-top:0; width:auto; min-width:110px; flex:1;">Buscar pregunta por ID</button>
          <button class="btn" id="start-btn" style="margin-top:0; flex:1;">Empezar práctica</button>
        </div>

        <div id="search-inline-row" class="search-inline-row">
          <div style="display:flex; gap:8px; margin-bottom:8px;">
            <input id="id-search-input" type="text" placeholder="Ej: 5156 o 5989.2"
              style="flex:1; padding:12px; background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:10px;">
            <button class="btn secondary" id="search-id-inline-btn"
              style="margin-top:0; width:auto; min-width:110px;">Buscar</button>
          </div>
          <div id="search-id-result" class="muted" style="font-size:0.82rem; min-height:1.2rem;"></div>

          <div id="id-preview-card"
            style="display:none; margin-top:12px; padding:12px; border:1px solid var(--border); border-radius:12px; background:rgba(56,189,248,0.06);">
            <div class="tag" style="margin-bottom:8px;">Vista previa</div>
            <div class="qtext" id="id-preview-question" style="font-size:0.98rem; margin-bottom:10px;"></div>
            <div id="id-preview-options" style="margin-bottom:10px;"></div>
            <div class="row">
              <button class="btn ghost" id="clear-search-btn" style="margin-top:0;">Volver</button>
              <button class="btn secondary" id="start-from-preview-btn" style="margin-top:0;">Ver pregunta</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="tag">Tu progreso</div>
        <div id="section-progress"></div>
        <button class="btn ghost" id="reset-btn">Reiniciar progreso guardado</button>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="card">
        <div class="tag" id="quiz-tag">Materia · 1/10</div>
        <div class="qtext" id="quiz-question"></div>
        <div id="quiz-options"></div>
        <div id="quiz-feedback"></div>
      </div>
      <div class="footer-nav">
        <button class="btn" id="next-btn" style="display:none;">Siguiente pregunta</button>
        <button class="btn secondary" id="quit-btn">Salir al inicio</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div id="screen-results" class="screen">
      <div class="card center">
        <div class="tag">Resultado de la sesión</div>
        <div class="big-num" id="result-score">-</div>
        <div class="muted" id="result-sub"></div>
      </div>
      <div class="card" id="miss-card" style="display:none;">
        <div class="tag">Para repasar</div>
        <div id="miss-list"></div>
      </div>
      <button class="btn" id="again-btn">Practicar otra vez</button>
      <button class="btn secondary" id="home-btn">Volver al inicio</button>
    </div>
  </div>

  <div id="app-confirm-overlay" class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="app-confirm-title">
      <h3 id="app-confirm-title" class="modal-title">Confirmar acción</h3>
      <p id="app-confirm-text" class="modal-text">¿Seguro que querés continuar?</p>
      <div class="modal-actions">
        <button class="btn ghost" id="app-confirm-cancel">Cancelar</button>
        <button class="btn" id="app-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    let QUIZ_DATA = [];
    const STORAGE_PREFIX = 'srvsop_pc_avion_progress_v1';
    const userInput = document.getElementById('user-input');
    const sectionSelect = document.getElementById('section-select');
    const lengthSelect = document.getElementById('length-select');
    const idSearchInput = document.getElementById('id-search-input');
    const searchIdResult = document.getElementById('search-id-result');
    const sessionToggleBtn = document.getElementById('session-toggle-btn');
    const sessionHeader = document.getElementById('session-header');
    const sessionSettingsBody = document.getElementById('session-settings-body');
    const searchInlineRow = document.getElementById('search-inline-row');
    const searchIdBtn = document.getElementById('search-id-btn');
    const idPreviewCard = document.getElementById('id-preview-card');
    const idPreviewQuestion = document.getElementById('id-preview-question');
    const idPreviewOptions = document.getElementById('id-preview-options');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const startFromPreviewBtn = document.getElementById('start-from-preview-btn');
    const appConfirmOverlay = document.getElementById('app-confirm-overlay');
    const appConfirmTitle = document.getElementById('app-confirm-title');
    const appConfirmText = document.getElementById('app-confirm-text');
    const appConfirmCancel = document.getElementById('app-confirm-cancel');
    const appConfirmYes = document.getElementById('app-confirm-yes');

    function getUserStorageKey() {
      const safeName = (userInput.value || 'anon').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
      return `${STORAGE_PREFIX}_${safeName || 'anon'}`;
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(getUserStorageKey());
        if (raw) return JSON.parse(raw);
      } catch (e) { }
      return { byId: {} };
    }

    function saveProgress(p) {
      try { localStorage.setItem(getUserStorageKey(), JSON.stringify(p)); } catch (e) { }
    }

    let progress = loadProgress();

    function populateSections() {
      const sections = [...new Set(QUIZ_DATA.map(q => q.section))];
      sectionSelect.innerHTML = '<option value="__all__">Todas las materias</option>' +
        sections.map(s => `<option value="${s}">${s} (${QUIZ_DATA.filter(q => q.section === s).length})</option>`).join('');
    }

    function populateLengths() {
      lengthSelect.innerHTML = '';
      [5, 10, 15, 20, 30, 9999].forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n === 9999 ? 'Todas' : (n + ' preguntas');
        lengthSelect.appendChild(opt);
      });
      lengthSelect.value = 10;
    }

    async function loadQuizData() {
      try {
        const response = await fetch('./quiz-data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar quiz-data.json');
        QUIZ_DATA = await response.json();
        populateSections();
        populateLengths();
        refreshHomeStats();
      } catch (err) {
        console.error(err);
        document.getElementById('section-progress').innerHTML = '<div class="muted">No se pudo cargar el archivo de preguntas.</div>';
      }
    }

    userInput.addEventListener('change', () => {
      progress = loadProgress();
      refreshHomeStats();
    });

    function refreshHomeStats() {
      const total = QUIZ_DATA.length;
      const answered = Object.values(progress.byId).filter(x => x.seen > 0).length;
      let correctSum = 0, totalSum = 0;
      Object.values(progress.byId).forEach(x => { correctSum += x.correctCount; totalSum += x.correctCount + x.wrongCount; });
      const acc = totalSum > 0 ? Math.round(100 * correctSum / totalSum) + '%' : '–';
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-answered').textContent = answered;
      document.getElementById('stat-accuracy').textContent = acc;

      const sections = [...new Set(QUIZ_DATA.map(q => q.section))];
      const secDiv = document.getElementById('section-progress');
      secDiv.innerHTML = sections.map(s => {
        const qs = QUIZ_DATA.filter(q => q.section === s);
        const seen = qs.filter(q => progress.byId[q.id] && progress.byId[q.id].seen > 0).length;
        const pct = Math.round(100 * seen / qs.length);
        return `<div style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px;">
        <span>${s}</span><span class="muted">${seen}/${qs.length}</span>
      </div>
      <div class="progress-bar" style="margin-bottom:0;"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
      }).join('');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    let sessionPanelOpen = true;

    function toggleSessionPanel(forceState) {
      if (typeof forceState === 'boolean') {
        sessionPanelOpen = forceState;
      } else {
        sessionPanelOpen = !sessionPanelOpen;
      }

      sessionSettingsBody.classList.toggle('session-collapsed', !sessionPanelOpen);
      sessionToggleBtn.setAttribute('aria-expanded', String(sessionPanelOpen));
      sessionToggleBtn.textContent = sessionPanelOpen ? '▾' : '▸';
    }

    function showQuestionPreview(question) {
      idPreviewCard.style.display = 'block';
      idPreviewQuestion.textContent = question.question;
      idPreviewOptions.innerHTML = '';
      Object.keys(question.options).sort().forEach(letter => {
        const item = document.createElement('div');
        item.style.marginBottom = '8px';
        item.style.padding = '10px 12px';
        item.style.border = '1px solid var(--border)';
        item.style.borderRadius = '10px';
        item.style.background = 'var(--card2)';
        item.innerHTML = `<b>${letter}.</b> ${question.options[letter]}`;
        idPreviewOptions.appendChild(item);
      });
    }

    function hideQuestionPreview() {
      idPreviewCard.style.display = 'none';
      idPreviewQuestion.textContent = '';
      idPreviewOptions.innerHTML = '';
      searchIdResult.textContent = '';
      idSearchInput.value = '';
    }

    function startQuestionById(inputId) {
      const found = QUIZ_DATA.find(q => String(q.id) === inputId);
      if (!found) {
        searchIdResult.textContent = 'No encontré una pregunta con ese ID.';
        return false;
      }

      sectionSelect.value = found.section;
      lengthSelect.value = 1;
      session = { questions: [found], idx: 0, correct: 0, wrong: 0, missed: [] };
      showScreen('screen-quiz');
      renderQuestion();
      return true;
    }

    function toggleIdSearchControls() {
      const visible = searchInlineRow.classList.toggle('visible');
      searchIdBtn.textContent = visible ? 'Cerrar buscador por ID' : 'Buscar pregunta por ID';
      if (!visible) {
        hideQuestionPreview();
      }
    }

    let pendingConfirmAction = null;

    function openConfirmModal({ title, text, confirmText, onConfirm }) {
      appConfirmTitle.textContent = title;
      appConfirmText.textContent = text;
      appConfirmYes.textContent = confirmText;
      pendingConfirmAction = onConfirm;
      appConfirmOverlay.classList.add('show');
    }

    function closeConfirmModal() {
      appConfirmOverlay.classList.remove('show');
      pendingConfirmAction = null;
    }

    // ---------- HOME SCREEN SETUP ----------
    populateLengths();
    loadQuizData();

    toggleSessionPanel(false);
    sessionHeader.addEventListener('click', () => toggleSessionPanel());
    sessionToggleBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleSessionPanel();
    });
    clearSearchBtn.addEventListener('click', () => hideQuestionPreview());
    searchIdBtn.addEventListener('click', () => toggleIdSearchControls());
    appConfirmCancel.addEventListener('click', closeConfirmModal);
    appConfirmOverlay.addEventListener('click', (event) => {
      if (event.target === appConfirmOverlay) closeConfirmModal();
    });
    appConfirmYes.addEventListener('click', () => {
      if (typeof pendingConfirmAction === 'function') pendingConfirmAction();
      closeConfirmModal();
    });
    startFromPreviewBtn.addEventListener('click', () => {
      const inputId = (idSearchInput.value || '').trim();
      if (!inputId) {
        searchIdResult.textContent = 'Ingresá un ID para ver la pregunta.';
        return;
      }
      startQuestionById(inputId);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      openConfirmModal({
        title: 'Reiniciar progreso',
        text: `¿Borrar todo el progreso guardado para "${userInput.value || 'anon'}" en este dispositivo?`,
        confirmText: 'Reiniciar',
        onConfirm: () => {
          progress = { byId: {} };
          saveProgress(progress);
          refreshHomeStats();
        }
      });
    });

    // ---------- QUIZ STATE ----------
    let session = null; // {questions:[], idx:0, correct:0, wrong:0, missed:[]}

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildQuestionSet() {
      const inputId = (idSearchInput.value || '').trim();
      if (inputId) {
        const found = QUIZ_DATA.find(q => String(q.id) === inputId);
        if (!found) {
          searchIdResult.textContent = 'No encontré una pregunta con ese ID.';
          return [];
        }

        searchIdResult.textContent = `Pregunta ${found.id} encontrada en ${found.section}.`;
        sectionSelect.value = found.section;
        lengthSelect.value = 1;
        return [found];
      }

      const sec = sectionSelect.value;
      const mode = document.getElementById('mode-select').value;
      const len = parseInt(lengthSelect.value, 10);

      let pool = QUIZ_DATA.filter(q => sec === '__all__' || q.section === sec);

      if (mode === 'unseen') {
        pool = pool.filter(q => !progress.byId[q.id] || progress.byId[q.id].seen === 0);
      } else if (mode === 'wrong') {
        pool = pool.filter(q => progress.byId[q.id] && progress.byId[q.id].lastCorrect === false);
      }

      pool = shuffle(pool);
      if (len !== 9999) pool = pool.slice(0, len);
      return pool;
    }

    const performSearchById = () => {
      const inputId = (idSearchInput.value || '').trim();
      if (!inputId) {
        searchIdResult.textContent = 'Ingresá un ID para buscar.';
        idPreviewCard.style.display = 'none';
        return;
      }

      const found = QUIZ_DATA.find(q => String(q.id) === inputId);
      if (!found) {
        searchIdResult.textContent = 'No encontré una pregunta con ese ID.';
        idPreviewCard.style.display = 'none';
        return;
      }

      searchIdResult.textContent = `Encontrada: ${found.id} · ${found.section}.`;
      hideQuestionPreview();
      startQuestionById(inputId);
    };

    document.getElementById('search-id-inline-btn').addEventListener('click', () => {
      performSearchById();
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      if (!QUIZ_DATA.length) {
        alert('Todavía no se cargaron las preguntas. Reintentá en unos segundos.');
        return;
      }

      const qs = buildQuestionSet();
      if (qs.length === 0) {
        alert('No hay preguntas disponibles con esos filtros. Probá otro modo o materia.');
        return;
      }

      session = { questions: qs, idx: 0, correct: 0, wrong: 0, missed: [] };
      showScreen('screen-quiz');
      renderQuestion();
    });

    function renderQuestion() {
      const q = session.questions[session.idx];
      document.getElementById('quiz-tag').textContent = `${q.section} · ${session.idx + 1}/${session.questions.length}`;
      document.getElementById('quiz-question').textContent = q.question;
      document.getElementById('progress-fill').style.width = Math.round(100 * session.idx / session.questions.length) + '%';

      const optsDiv = document.getElementById('quiz-options');
      optsDiv.innerHTML = '';
      Object.keys(q.options).sort().forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerHTML = `<b>${letter}.</b> ${q.options[letter]}`;
        btn.addEventListener('click', () => selectAnswer(letter));
        optsDiv.appendChild(btn);
      });

      document.getElementById('quiz-feedback').innerHTML = '';
      document.getElementById('next-btn').style.display = 'none';
    }

    function selectAnswer(letter) {
      const q = session.questions[session.idx];
      const isCorrect = letter === q.answer;

      // update stored progress
      if (!progress.byId[q.id]) progress.byId[q.id] = { seen: 0, correctCount: 0, wrongCount: 0, lastCorrect: null };
      const rec = progress.byId[q.id];
      rec.seen += 1;
      if (isCorrect) { rec.correctCount += 1; rec.lastCorrect = true; }
      else { rec.wrongCount += 1; rec.lastCorrect = false; }
      saveProgress(progress);

      if (isCorrect) session.correct++;
      else { session.wrong++; session.missed.push(q); }

      // lock options, mark correct/incorrect
      document.querySelectorAll('.opt').forEach(btn => {
        btn.classList.add('disabled');
        const btnLetter = btn.querySelector('b').textContent.replace('.', '').trim();
        if (btnLetter === q.answer) btn.classList.add('correct');
        else if (btnLetter === letter) btn.classList.add('incorrect');
      });

      const fb = document.getElementById('quiz-feedback');
      fb.innerHTML = `<div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <div class="lead">${isCorrect ? '✅ ¡Correcto!' : '❌ Incorrecto — la respuesta era ' + q.answer}</div>
      <div class="expl">${q.explanation}</div>
    </div>`;

      document.getElementById('next-btn').style.display = 'block';
    }

    document.getElementById('next-btn').addEventListener('click', () => {
      session.idx++;
      if (session.idx >= session.questions.length) {
        finishSession();
      } else {
        renderQuestion();
      }
    });

    document.getElementById('quit-btn').addEventListener('click', () => {
      openConfirmModal({
        title: 'Salir al inicio',
        text: '¿Seguro que querés salir de la práctica actual? La sesión en curso se perderá.',
        confirmText: 'Salir',
        onConfirm: () => {
          showScreen('screen-home');
          refreshHomeStats();
        }
      });
    });

    function finishSession() {
      document.getElementById('progress-fill').style.width = '100%';
      const total = session.questions.length;
      const pct = Math.round(100 * session.correct / total);
      document.getElementById('result-score').textContent = `${session.correct}/${total} (${pct}%)`;
      let msg = '';
      if (pct === 100) msg = '¡Impecable! Dominás este bloque.';
      else if (pct >= 80) msg = 'Muy bien, vas encaminado.';
      else if (pct >= 60) msg = 'Bien, pero conviene repasar los fallos.';
      else msg = 'Convendría repasar esta materia con más calma.';
      document.getElementById('result-sub').textContent = msg;

      const missCard = document.getElementById('miss-card');
      const missList = document.getElementById('miss-list');
      if (session.missed.length) {
        missCard.style.display = 'block';
        missList.innerHTML = session.missed.map(q => `
      <div class="miss-item">
        <div class="q">${q.id} — ${q.question}</div>
        <div class="a">Correcta: ${q.answer}. ${q.options[q.answer]}</div>
      </div>`).join('');
      } else {
        missCard.style.display = 'none';
      }

      showScreen('screen-results');
    }

    document.getElementById('again-btn').addEventListener('click', () => {
      showScreen('screen-home');
      refreshHomeStats();
    });
    document.getElementById('home-btn').addEventListener('click', () => {
      showScreen('screen-home');
      refreshHomeStats();
    });
  </script>
</body>

</html>
